services:
  - type: web
    name: elite-os-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-facturai1.vercel.app
    healthCheckPath: /health
    plan: free
